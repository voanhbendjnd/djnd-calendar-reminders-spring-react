spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/faptimetable}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET:supersecretkeythatisatleast32byteslongforhs256!}
  expiration: 86400000

cors:
  allowed-origins: ${FRONTEND_URL:http://localhost:5173}

internal:
  job:
    secret: ${INTERNAL_JOB_SECRET:local-dev-secret-change-in-production}
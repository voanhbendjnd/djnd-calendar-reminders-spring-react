services:
  # Backend Web Service
  - type: web
    name: fap-timetable-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      - key: PORT
        value: 8080

      - key: DATABASE_URL
        fromDatabase:
          name: fap-timetable-db
          property: connectionString

      - key: DATABASE_USERNAME
        fromDatabase:
          name: fap-timetable-db
          property: user

      - key: DATABASE_PASSWORD
        fromDatabase:
          name: fap-timetable-db
          property: password

      - key: JWT_SECRET
        generateValue: true

      - key: MAIL_HOST
        sync: false

      - key: MAIL_PORT
        value: 587

      - key: MAIL_USERNAME
        sync: false

      - key: MAIL_PASSWORD
        sync: false

      - key: FRONTEND_URL
        sync: false

      - key: INTERNAL_JOB_SECRET
        generateValue: true

  # Frontend Static Site
  - type: static
    name: fap-timetable-frontend
    buildCommand: npm install && npm run build
    publishDirectory: ./frontend/dist
    rootDirectory: ./frontend
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: fap-timetable-backend
          property: url
          propertyEnvVar: RENDER_EXTERNAL_URL

databases:
  - name: fap-timetable-db
    databaseName: faptimetable
    user: faptimetable
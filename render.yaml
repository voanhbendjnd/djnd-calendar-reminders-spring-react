services:

  # =========================
  # Backend
  # =========================
  - type: web
    name: fap-timetable-backend
    runtime: docker
    plan: free

    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      - key: PORT
        value: 8080

      - key: DATABASE_URL
        fromDatabase:
          name: fap-timetable-db
          property: connectionString

      - key: DATABASE_USERNAME
        fromDatabase:
          name: fap-timetable-db
          property: user

      - key: DATABASE_PASSWORD
        fromDatabase:
          name: fap-timetable-db
          property: password

      - key: JWT_SECRET
        generateValue: true

      - key: MAIL_HOST
        sync: false

      - key: MAIL_PORT
        value: 587

      - key: MAIL_USERNAME
        sync: false

      - key: MAIL_PASSWORD
        sync: false

      - key: FRONTEND_URL
        sync: false

      - key: INTERNAL_JOB_SECRET
        generateValue: true


  # =========================
  # Frontend
  # =========================
  - type: web
    name: fap-timetable-frontend
    runtime: static

    plan: free

    buildCommand: npm install && npm run build
    staticPublishPath: ./frontend/dist
    rootDir: ./frontend

    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: fap-timetable-backend
          envVarKey: RENDER_EXTERNAL_URL

    routes:
      - type: rewrite
        source: /*
        destination: /index.html


# =========================
# PostgreSQL
# =========================
databases:
  - name: fap-timetable-db
    databaseName: faptimetable
    user: faptimetable